services:
  - type: web
    name: docling-asr-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter        # minimum viable — free tier won't work
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0